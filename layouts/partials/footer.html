{{- /* 覆盖主题 footer：极简一行 + 页面级少量 vanilla JS。
    脚本：1) 背景视差  2) 锚点平滑滚动（含 TOC）  3) 代码块复制按钮 */ -}}
<footer class="site-footer">
  <div class="site-footer__inner">
    <span class="site-footer__copy">© {{ now.Year }} Zi-Yi-Ming</span>
    <span class="site-footer__sep" aria-hidden="true">·</span>
    <span class="site-footer__credit">
      Powered by
      <a href="https://gohugo.io" rel="noopener" target="_blank">Hugo</a>
      +
      <a href="https://github.com/adityatelange/hugo-PaperMod/" rel="noopener" target="_blank">PaperMod</a>
    </span>
  </div>
  <a class="top-fab" href="#top" aria-label="回到顶部" title="回到顶部">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="17 11 12 6 7 11"></polyline>
      <polyline points="17 18 12 13 7 18"></polyline>
    </svg>
  </a>
</footer>

<script>
(function () {
  "use strict";
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var finePointer = window.matchMedia("(pointer: fine)").matches;

  /* 1. 背景视差：跟随指针极轻微移动（与 night_archive_motion_demo 同参数） */
  var photo = document.querySelector(".site-bg__photo");
  var moon = document.querySelector(".site-bg__moon");
  if (photo && moon && finePointer && !reduceMotion) {
    var tx = 0, ty = 0, cx = 0, cy = 0;
    document.addEventListener("pointermove", function (e) {
      tx = e.clientX / window.innerWidth - 0.5;
      ty = e.clientY / window.innerHeight - 0.5;
    }, { passive: true });
    (function frame() {
      cx += (tx - cx) * 0.035;
      cy += (ty - cy) * 0.035;
      photo.style.transform = "translate(" + (cx * -6).toFixed(2) + "px," + (cy * -4).toFixed(2) + "px) scale(1.03)";
      moon.style.transform = "translate(" + (cx * 12).toFixed(2) + "px," + (cy * 8).toFixed(2) + "px)";
      window.requestAnimationFrame(frame);
    })();
  }

  /* 2. 同页锚点平滑滚动（TOC / #top） */
  document.querySelectorAll('a[href^="#"]').forEach(function (anchor) {
    anchor.addEventListener("click", function (e) {
      var id = this.getAttribute("href").slice(1);
      var target = document.getElementById(decodeURIComponent(id));
      if (!target) return;
      e.preventDefault();
      if (reduceMotion) {
        target.scrollIntoView();
      } else {
        target.scrollIntoView({ behavior: "smooth" });
      }
      if (id === "top") {
        history.replaceState(null, null, " ");
      } else {
        history.pushState(null, null, "#" + id);
      }
    });
  });

  /* 3. 代码块复制按钮（与 PaperMod 一致，适配 .highlight 容器） */
  document.querySelectorAll("pre > code").forEach(function (codeblock) {
    var container = codeblock.parentNode.parentNode;
    var copybutton = document.createElement("button");
    copybutton.className = "copy-code";
    copybutton.innerHTML = '{{- i18n "code_copy" | default "copy" }}';
    var doneText = '{{- i18n "code_copied" | default "copied!" }}';
    copybutton.addEventListener("click", function () {
      var text = codeblock.textContent;
      function ok() {
        copybutton.innerHTML = doneText;
        setTimeout(function () { copybutton.innerHTML = copybutton.innerHTML === doneText ? '{{- i18n "code_copy" | default "copy" }}' : copybutton.innerHTML; }, 2000);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(ok);
        return;
      }
      var range = document.createRange();
      range.selectNodeContents(codeblock);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      try { document.execCommand("copy"); ok(); } catch (e) {}
      sel.removeRange(range);
    });
    if (container.classList.contains("highlight")) {
      container.appendChild(copybutton);
    } else if (codeblock.parentNode.parentNode.parentNode.parentNode.parentNode.nodeName === "TABLE") {
      codeblock.parentNode.parentNode.parentNode.parentNode.parentNode.appendChild(copybutton);
    } else {
      codeblock.parentNode.appendChild(copybutton);
    }
  });

  /* ============ 动效一：首页入场（hero 分层渐显）+ 滚动提示 ============ */
  /* html.js 标记已提前到 baseof <head>（首帧前），此处不再重复设置 */
  var homeEl = document.querySelector(".page--home");

  function markAnim(el, delayMs) {
    if (!el) return;
    el.classList.add("anim");
    el.style.setProperty("--d", (delayMs || 0) + "ms");
  }

  if (homeEl && !reduceMotion) {
    /* 首屏进场：hero 元素 + 分隔线 + 档案区头，逐层 stagger
       （大字单独做字符级 stagger，不进 entryEls 的整块 translateY） */
    var heroName = homeEl.querySelector(".hero__name");
    if (heroName) {
      var nameText = heroName.textContent.replace(/\s+/g, " ").trim();
      heroName.setAttribute("aria-label", nameText);
      heroName.textContent = "";
      heroName.classList.add("is-split");
      nameText.split("").forEach(function (ch, i) {
        var s = document.createElement("span");
        s.className = "hero__ch";
        s.textContent = ch === " " ? " " : ch;
        s.style.setProperty("--d", (180 + i * 42) + "ms");
        s.setAttribute("aria-hidden", "true");
        heroName.appendChild(s);
      });
    }

    var entryEls = [].slice.call(homeEl.querySelectorAll(
      ".hero__eyebrow,.hero__role,.hero__focus,.hero__aside," +
      ".page__rule,.archive__head"
    ));
    entryEls.forEach(function (el, i) { markAnim(el, i * 110); });
    if (heroName) markAnim(heroName, 0);

    /* 视口显现：条目行 / 列标签 / About 条，错峰进入 */
    var revealEls = [].slice.call(homeEl.querySelectorAll(
      ".entry-row,.archive__col-label,.about-strip"
    ));
    revealEls.forEach(function (el) { markAnim(el, 0); });

    var io = ("IntersectionObserver" in window)
      ? new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) { en.target.classList.add("is-in"); io.unobserve(en.target); }
          });
        }, { threshold: 0.12, rootMargin: "0px 0px -6% 0px" })
      : null;

    revealEls.forEach(function (el) { io ? io.observe(el) : el.classList.add("is-in"); });

    /* 首屏进场在布局后一小拍触发，保证动画从"隐藏帧"可见地开始 */
    setTimeout(function () {
      entryEls.forEach(function (el) { el.classList.add("is-in"); });
      if (heroName) heroName.classList.add("is-in");
    }, 260);

    /* 滚动提示：底部 SCROLL + 下落小点；滚过首屏后淡出（一次性） */
    var cue = document.createElement("div");
    cue.className = "hero-cue";
    cue.innerHTML = '<span class="hero-cue__label">SCROLL</span>' +
                    '<span class="hero-cue__rail"><i class="hero-cue__dot"></i></span>';
    document.body.appendChild(cue);
    /* 停顿期间先亮起 SCROLL 提示，下滑开始后随滚动淡出 */
    var cueHidden = false;
    setTimeout(function () { cue.classList.add("is-on"); }, 1000);
    window.addEventListener("scroll", function () {
      if (!cueHidden && window.scrollY > 24) { cueHidden = true; cue.classList.remove("is-on"); }
    }, { passive: true });

    /* ============ 动效二：自动下滑导览 ============
       仅桌面 + 精细指针 + 每会话一次；任一用户输入即中断。
       URL 加 ?tour=1 强制播放，?notour=1 永久跳过本次会话。 */
    (function () {
      var wide = window.innerWidth >= 1024;
      var finePtr = window.matchMedia("(pointer: fine)").matches;
      var touch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
      if (!wide || !finePtr || touch) return;

      var want = location.search.indexOf("tour=1") !== -1;
      var skip = location.search.indexOf("notour=1") !== -1;
      if (skip) { sessionStorage.setItem("zym-tour", "1"); return; }
      if (sessionStorage.getItem("zym-tour") && !want) return;

      var cancel = false, rafId = null;

      /* easeOutQuint：起步快、尾段明显减速滑停 */
      function easeIO(t) { return 1 - Math.pow(1 - t, 5); }
      function kill() {
        cancel = true;
        if (rafId) cancelAnimationFrame(rafId);
        document.documentElement.classList.remove("tour");
        sessionStorage.setItem("zym-tour", "1");
      }
      function stopNow() { kill(); detach(); }
      function detach() {
        document.removeEventListener("pointerdown", stopNow);
        document.removeEventListener("wheel", stopNow);
        document.removeEventListener("touchstart", stopNow);
        document.removeEventListener("keydown", stopNow);
        window.removeEventListener("scroll", checkUserScroll);
      }
      function waitMs(ms, done) {
        var t0 = Date.now();
        (function chk() {
          if (cancel) { done(true); return; }
          if (Date.now() - t0 >= ms) { done(false); } else { requestAnimationFrame(chk); }
        })();
      }

      /* 正式开播前用户若自行滚动过（>40px），则放弃 */
      var baseY = window.scrollY, userMoved = false;
      function checkUserScroll() { if (Math.abs(window.scrollY - baseY) > 40) userMoved = true; }
      window.addEventListener("scroll", checkUserScroll, { passive: true });

      function play() {
        detach();
        if (userMoved) { kill(); return; }
        document.documentElement.classList.add("tour");
        sessionStorage.setItem("zym-tour", "1");

        /* 只把 ZI-YI-MING 大字带到视口上方停住：单段、更慢更柔，不再滑到底 */
        var stops = [{ sel: ".hero__name", off: 92, dur: 3000, hold: 900 }];
        var i = 0, total = stops.length;

        function leg() {
          if (cancel) return;
          var s = stops[i], targetY = s.y || 0;
          if (s.sel) {
            var el = homeEl.querySelector(s.sel);
            if (!el) { return finish(); }
            targetY = el.getBoundingClientRect().top + window.scrollY - (s.off || 16);
          }
          var startY = window.scrollY, delta = targetY - startY;
          var t0 = null;
          if (Math.abs(delta) < 2) { stepDone(); return; }
          function frame(ts) {
            if (cancel) return;
            if (!t0) t0 = ts;
            var p = Math.min(1, (ts - t0) / s.dur);
            window.scrollTo(0, startY + delta * easeIO(p));
            if (p < 1) { rafId = requestAnimationFrame(frame); } else { stepDone(); }
          }
          function stepDone() {
            i += 1;
            if (i < total) { waitMs(stops[i - 1].hold, function (aborted) { if (!aborted) leg(); }); }
            else { finish(); }
          }
          rafId = requestAnimationFrame(frame);
        }
        function finish() {
          waitMs(800, function () { kill(); });
        }
        setTimeout(leg, 700);
      }

      document.addEventListener("pointerdown", stopNow);
      document.addEventListener("wheel", stopNow, { passive: true });
      document.addEventListener("touchstart", stopNow, { passive: true });
      document.addEventListener("keydown", stopNow);
      /* 入场渐显收尾后稍作停顿即下滑（~1.4s 起，不拖沓） */
      setTimeout(play, 1400);
    })();
  }

  /* ============ 动效三：非首页的滚动显现（列表/标签等页，与首页同机制，条目错峰滑入） ============ */
  if (!homeEl && !reduceMotion) {
    var listPage = document.querySelector(".page");
    if (listPage) {
      var listEls = [].slice.call(listPage.querySelectorAll(
        ".entry-row,.list-block__label,.page-head__kicker,.page-head__desc," +
        ".page--doc .post-content h2,.page--doc .post-content table," +
        ".page--doc .post-content pre,.page--doc .post-content .stat-strip"
      ));
      listEls.forEach(function (el) { markAnim(el, 0); });
      var ioList = ("IntersectionObserver" in window)
        ? new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
              if (en.isIntersecting) { en.target.classList.add("is-in"); ioList.unobserve(en.target); }
            });
          }, { threshold: 0.1, rootMargin: "0px 0px -4% 0px" })
        : null;
      listEls.forEach(function (el) { ioList ? ioList.observe(el) : el.classList.add("is-in"); });
    }
  }

  /* ============ 单页：TOC 随滚动高亮（视口上缘带内命中即点亮，取最靠上者） ============ */
  var tocNav = document.querySelector(".article-toc #TableOfContents");
  if (tocNav && "IntersectionObserver" in window) {
    var tocById = {};
    var tocOrder = [];
    tocNav.querySelectorAll("a").forEach(function (a) {
      var id = (a.getAttribute("href") || "").slice(1);
      if (id && !tocById[id]) { tocById[id] = a; tocOrder.push(id); }
    });
    if (tocOrder.length) {
      var spy = new IntersectionObserver(function (entries) {
        var minIdx = -1;
        entries.forEach(function (en) {
          if (!en.isIntersecting) return;
          var idx = tocOrder.indexOf(en.target.id);
          if (idx > -1 && (minIdx === -1 || idx < minIdx)) { minIdx = idx; }
        });
        if (minIdx > -1) {
          tocNav.querySelectorAll("a.is-active").forEach(function (x) { x.classList.remove("is-active"); });
          tocById[tocOrder[minIdx]].classList.add("is-active");
        }
      }, { rootMargin: "-12% 0px -76% 0px", threshold: 0 });
      tocOrder.forEach(function (id) {
        var h = document.getElementById(id);
        if (h) spy.observe(h);
      });
    }
  }

  /* ============ 背景亮度随滚动渐变（仅首页） ============
     顶部先更亮（--pb≈0.88）→ 滚动到自动停靠位（大字距顶 92px）时
     回落到全站当前亮度 0.72，之后恒定；其它页默认 0.72 不变 */
  if (homeEl) {
    var pbStart = 0.88, pbEnd = 0.72;
    function applyBgBrightness() {
      var nameEl = homeEl.querySelector(".hero__name");
      var dockY = 60;
      if (nameEl) {
        dockY = nameEl.getBoundingClientRect().top + window.scrollY - 92;
        if (dockY < 40) { dockY = 40; }
      }
      var p = Math.min(1, Math.max(0, window.scrollY / dockY));
      var val = (pbStart - (pbStart - pbEnd) * p).toFixed(3);
      document.documentElement.style.setProperty("--pb", val);
    }
    window.addEventListener("scroll", applyBgBrightness, { passive: true });
    applyBgBrightness();
  }

  /* ============ 动效：文章阅读进度（scroll-linked） ============
     仅 .page--article；量 .article__content 穿过视口的比例。
     rAF + lerp 轻微阻尼，避免 transform 跟滚过于生硬。 */
  var articlePage = document.querySelector(".page--article");
  var articleBody = articlePage && articlePage.querySelector(".article__content");
  if (articleBody) {
    var progress = document.createElement("div");
    progress.className = "read-progress";
    progress.setAttribute("aria-hidden", "true");
    progress.innerHTML = '<span class="read-progress__bar"></span>';
    document.body.appendChild(progress);
    var pBar = progress.firstChild;
    var pTarget = 0, pCurrent = 0, pRaf = 0;

    function measureProgress() {
      var rect = articleBody.getBoundingClientRect();
      var viewH = window.innerHeight;
      var startY = rect.top + window.scrollY - viewH * 0.12;
      var endY = rect.bottom + window.scrollY - viewH * 0.88;
      var span = Math.max(1, endY - startY);
      pTarget = Math.min(1, Math.max(0, (window.scrollY - startY) / span));
      if (window.scrollY > 100) progress.classList.add("is-on");
      else progress.classList.remove("is-on");
    }

    function progressFrame() {
      var step = reduceMotion ? 1 : 0.22;
      pCurrent += (pTarget - pCurrent) * step;
      if (Math.abs(pTarget - pCurrent) < 0.001) pCurrent = pTarget;
      pBar.style.transform = "scaleX(" + pCurrent.toFixed(4) + ")";
      if (pCurrent !== pTarget) {
        pRaf = requestAnimationFrame(progressFrame);
      } else {
        pRaf = 0;
      }
    }

    function onProgressScroll() {
      measureProgress();
      if (!pRaf) pRaf = requestAnimationFrame(progressFrame);
    }

    window.addEventListener("scroll", onProgressScroll, { passive: true });
    window.addEventListener("resize", onProgressScroll, { passive: true });
    onProgressScroll();
  }

  /* ============ 动效：顶栏向下滚收起、向上滚露出 ============ */
  (function () {
    var header = document.querySelector(".site-header");
    if (!header || reduceMotion) return;
    var lastY = window.scrollY;
    var lock = false;
    window.addEventListener("scroll", function () {
      if (lock || document.documentElement.classList.contains("cmdk-open")) return;
      lock = true;
      requestAnimationFrame(function () {
        var y = window.scrollY;
        var dy = y - lastY;
        if (y < 72) {
          header.classList.remove("is-hidden");
        } else if (dy > 4) {
          header.classList.add("is-hidden");
        } else if (dy < -4) {
          header.classList.remove("is-hidden");
        }
        lastY = y;
        lock = false;
      });
    }, { passive: true });
  })();

  /* ============ 命令面板 Cmd/Ctrl+K ============ */
  (function () {
    var root = document.getElementById("cmdk");
    if (!root) return;
    var input = document.getElementById("cmdkInput");
    var list = document.getElementById("cmdkList");
    var indexUrl = root.getAttribute("data-index") || "/index.json";

    var navItems = [{ title: "Home", permalink: "/", kind: "page", hint: "首页" }];
    document.querySelectorAll(".site-header__nav .site-header__link").forEach(function (a) {
      var href = a.getAttribute("href") || "";
      var text = (a.textContent || "").replace(/⌘K/g, "").trim();
      var isExt = a.classList.contains("site-header__link--ext") || /^https?:/i.test(href);
      if (!href) return;
      navItems.push({
        title: text || href,
        permalink: href,
        kind: isExt ? "ext" : "nav",
        hint: isExt ? "外部" : "导航"
      });
    });

    var archive = null;
    var loading = null;
    var active = -1;
    var rows = [];
    var lastFocus = null;

    function loadIndex() {
      if (archive) return Promise.resolve(archive);
      if (loading) return loading;
      loading = fetch(indexUrl)
        .then(function (r) { return r.ok ? r.json() : []; })
        .then(function (data) {
          archive = (data || []).map(function (item) {
            return {
              title: item.title || "",
              permalink: item.permalink || "#",
              summary: item.summary || "",
              content: item.content || "",
              kind: "doc",
              hint: "档案"
            };
          });
          return archive;
        })
        .catch(function () { archive = []; return archive; });
      return loading;
    }

    function kindLabel(kind) {
      if (kind === "nav") return "NAV";
      if (kind === "ext") return "EXT";
      if (kind === "page") return "HOME";
      return "DOC";
    }

    function scoreItem(item, q) {
      var title = (item.title || "").toLowerCase();
      var summary = (item.summary || "").toLowerCase();
      var content = (item.content || "").toLowerCase();
      var path = (item.permalink || "").toLowerCase();
      if (title.indexOf(q) !== -1) return 120 - title.indexOf(q);
      if (summary.indexOf(q) !== -1) return 80 - Math.min(40, summary.indexOf(q));
      if (path.indexOf(q) !== -1) return 60;
      if (content.indexOf(q) !== -1) return 40;
      return -1;
    }

    function collect(q) {
      q = (q || "").trim().toLowerCase();
      var pool = navItems.concat(archive || []);
      if (!q) {
        return pool.filter(function (x) { return x.kind !== "doc"; }).slice(0, 8);
      }
      return pool
        .map(function (item) {
          return { item: item, s: scoreItem(item, q) };
        })
        .filter(function (x) { return x.s >= 0; })
        .sort(function (a, b) { return b.s - a.s; })
        .slice(0, 10)
        .map(function (x) { return x.item; });
    }

    function setActive(next) {
      if (!rows.length) { active = -1; return; }
      if (next < 0) next = rows.length - 1;
      if (next >= rows.length) next = 0;
      active = next;
      rows.forEach(function (el, i) {
        el.classList.toggle("is-active", i === active);
        if (i === active) {
          el.scrollIntoView({ block: "nearest" });
        }
      });
    }

    function render(q) {
      var items = collect(q);
      rows = [];
      active = -1;
      list.innerHTML = "";
      if (!items.length) {
        var empty = document.createElement("li");
        empty.className = "cmdk__empty";
        empty.textContent = "NO MATCH · 换个关键词";
        list.appendChild(empty);
        return;
      }
      items.forEach(function (item, i) {
        var li = document.createElement("li");
        li.className = "cmdk__item";
        li.setAttribute("role", "option");
        li.dataset.href = item.permalink;
        li.dataset.kind = item.kind || "doc";
        var desc = item.summary
          ? item.summary.replace(/\s+/g, " ").slice(0, 90)
          : "";
        li.innerHTML =
          '<span class="cmdk__item-kind">' + kindLabel(item.kind) + "</span>" +
          '<span class="cmdk__item-title"></span>' +
          '<span class="cmdk__item-hint">' + (item.hint || "") + "</span>" +
          (desc ? '<span class="cmdk__item-desc"></span>' : "");
        li.querySelector(".cmdk__item-title").textContent = item.title;
        if (desc) li.querySelector(".cmdk__item-desc").textContent = desc;
        li.addEventListener("click", function () { go(item); });
        list.appendChild(li);
        rows.push(li);
      });
      setActive(0);
    }

    function go(item) {
      var href = item && item.permalink;
      if (!href) return;
      close();
      if (item.kind === "ext" || /^https?:\/\//i.test(href)) {
        window.open(href, "_blank", "noopener");
      } else {
        window.location.href = href;
      }
    }

    function open() {
      if (!root.hasAttribute("hidden")) return;
      lastFocus = document.activeElement;
      root.removeAttribute("hidden");
      document.documentElement.classList.add("cmdk-open");
      input.value = "";
      render("");
      loadIndex().then(function () { if (input.value === "") render(""); });
      input.focus();
    }

    function close() {
      if (root.hasAttribute("hidden")) return;
      root.setAttribute("hidden", "");
      document.documentElement.classList.remove("cmdk-open");
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }

    function toggle() {
      if (root.hasAttribute("hidden")) open();
      else close();
    }

    document.addEventListener("keydown", function (e) {
      var isMod = e.metaKey || e.ctrlKey;
      if (isMod && (e.key === "k" || e.key === "K")) {
        e.preventDefault();
        toggle();
        return;
      }
      if (root.hasAttribute("hidden")) return;
      if (e.key === "Escape") {
        e.preventDefault();
        close();
        return;
      }
      /* 焦点陷阱：面板唯一可聚焦元素是输入框，Tab 不逃出对话框 */
      if (e.key === "Tab") {
        e.preventDefault();
        input.focus();
        return;
      }
      if (e.key === "ArrowDown") {
        e.preventDefault();
        setActive(active + 1);
        return;
      }
      if (e.key === "ArrowUp") {
        e.preventDefault();
        setActive(active - 1);
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        var el = rows[active];
        if (el && el.dataset.href) go({ permalink: el.dataset.href, kind: el.dataset.kind });
      }
    });

    input.addEventListener("input", function () { render(input.value); });
    root.querySelectorAll("[data-cmdk-close]").forEach(function (el) {
      el.addEventListener("click", close);
    });
  })();

  /* 回到顶部 FAB（全站）：滚动过半渐显；点击回顶由上方锚点处理器负责 */
  var fab = document.querySelector(".top-fab");
  if (fab) {
    var fabLock = false;
    function toggleFab() {
      var y = window.scrollY || document.documentElement.scrollTop;
      if (y > window.innerHeight * 0.5) { fab.classList.add("is-show"); }
      else { fab.classList.remove("is-show"); }
    }
    window.addEventListener("scroll", function () {
      if (fabLock) return;
      fabLock = true;
      setTimeout(function () { fabLock = false; toggleFab(); }, 120);
    }, { passive: true });
    toggleFab();
  }
})();
</script>
