baseURL = 'https://Zi-Yi-Ming.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'Zi-Yi-Ming'
theme = 'papermod'

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
paginate = 10

# 让首页输出 index.json，供搜索页 (fastsearch.js) 抓取建索引
[outputs]
  home = ['HTML', 'RSS', 'JSON']

[markup.goldmark.extensions]
  # 关闭 typographer(旧名 smartypants):避免把 I'm 的直撇号转成 U+2019 弯引号,
  # 中文字体 fallback 下会被渲染成近乎全宽字符,导致 I 和 m 间距过大
  typographer = false

[markup.goldmark.renderer]
  # 允许 content 中的原生 HTML（如 about.md 的量化数据行 stat-strip）；
  # 内容均为本站自写 markdown，无第三方注入风险
  unsafe = true

# TOC 收录 h2–h4（笔记长文习惯用三级标题）
[markup.tableOfContents]
  startLevel = 2
  endLevel = 4

[params]
  env = 'production'
  title = 'Zi-Yi-Ming'
  description = 'Zi-Yi-Ming 的个人作品集：开源工具、量化研究、云服务与机器视觉'
  author = 'Zi-Yi-Ming'
  DateFormat = '2006-01-02'
  defaultTheme = 'dark'
  # Light 模式暂缓：先隐藏主题切换（PaperMod head/footer 脚本按此开关生效）
  disableThemeToggle = true
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  hideFooter = false
  defaultOgImage = '/og-default.png'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/Zi-Yi-Ming'

  [[menu.main]]
    identifier = 'projects'
    name = 'Projects'
    url = '/projects/'
    weight = 1
  [[menu.main]]
    identifier = 'notes'
    name = 'Notes'
    url = '/notes/'
    weight = 2
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 3
  [[menu.main]]
    identifier = 'toolbox'
    name = 'Toolbox'
    url = '/toolbox/'
    weight = 4
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 5
