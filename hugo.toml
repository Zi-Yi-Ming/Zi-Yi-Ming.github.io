baseURL = 'https://Zi-Yi-Ming.github.io/'
locale = 'zh-cn'
title = '我的博客'
theme = 'papermod'

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
paginate = 10

[params]
  env = 'production'
  title = '我的博客'
  description = '记录技术、思考与生活'
  author = '我'
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  hideFooter = false

  [params.homeInfoParams]
    Title = '你好，欢迎来到我的博客 👋'
    Content = '这里是我的个人博客，用 Hugo + GitHub Pages 搭建，记录技术笔记、学习心得与生活随想。'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/'

  [[menu.main]]
    identifier = 'home'
    name = '首页'
    url = '/'
    weight = 1
  [[menu.main]]
    identifier = 'toolbox'
    name = '自用清单'
    url = '/toolbox/'
    weight = 2
  [[menu.main]]
    identifier = 'notes'
    name = '博客笔记'
    url = '/notes/'
    weight = 3
  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 4
  [[menu.main]]
    identifier = 'archives'
    name = '归档'
    url = '/archives/'
    weight = 5
  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 6
