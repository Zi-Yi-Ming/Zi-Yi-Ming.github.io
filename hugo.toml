baseURL = 'https://Zi-Yi-Ming.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
languageCode = 'zh-cn'
title = '我的博客'
theme = 'papermod'

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
paginate = 10

[params]
  env = 'production'
  title = '我的博客'
  description = '记录我正在学习、构建和折腾的一切'
  author = 'Zi-Yi-Ming'
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  hideFooter = false
  defaultOgImage = '/og-default.png'

  [params.homeInfoParams]
    Title = '你好，欢迎来到我的博客 👋'
    Content = '一个软件工程学生的个人空间。记录正在学的东西、正在搭的项目，还有一些折腾的过程。'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/Zi-Yi-Ming'

  [[menu.main]]
    identifier = 'home'
    name = '首页'
    url = '/'
    weight = 1
  [[menu.main]]
    identifier = 'toolbox'
    name = '自用清单'
    url = '/toolbox/'
    weight = 2
  [[menu.main]]
    identifier = 'notes'
    name = '博客笔记'
    url = '/notes/'
    weight = 3
  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 4
  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 6
