baseURL = 'https://Zi-Yi-Ming.github.io/'
locale = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = 'Zi-Yi-Ming'
theme = 'papermod'

enableRobotsTXT = true
enableEmoji = true
hasCJKLanguage = true
paginate = 10

[markup.goldmark.extensions]
  # 关闭 typographer(旧名 smartypants):避免把 I'm 的直撇号转成 U+2019 弯引号,
  # 中文字体 fallback 下会被渲染成近乎全宽字符,导致 I 和 m 间距过大
  typographer = false

[params]
  env = 'production'
  title = 'Zi-Yi-Ming'
  description = 'Zi-Yi-Ming 的个人作品集：开源工具、量化研究、云服务与机器视觉'
  author = 'Zi-Yi-Ming'
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  TocOpen = false
  hideFooter = false
  defaultOgImage = '/og-default.png'

  [params.homeInfoParams]
    Title = '你好，欢迎来到我的个人空间 👋'
    Content = '一个软件工程学生的个人空间。记录正在学的东西、正在搭的项目，还有一些折腾的过程。'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/Zi-Yi-Ming'

  [[menu.main]]
    identifier = 'home'
    name = '首页'
    url = '/'
    weight = 1
  [[menu.main]]
    identifier = 'projects'
    name = '项目'
    url = '/projects/'
    weight = 2
  [[menu.main]]
    identifier = 'about'
    name = '关于'
    url = '/about/'
    weight = 3
  [[menu.main]]
    identifier = 'toolbox'
    name = '自用清单'
    url = '/toolbox/'
    weight = 4
  [[menu.main]]
    identifier = 'notes'
    name = '笔记'
    url = '/notes/'
    weight = 5
  [[menu.main]]
    identifier = 'search'
    name = '搜索'
    url = '/search/'
    weight = 6
